[package]
name = "chessova-desktop"
version = "0.2.0"
edition = "2021"
description = "Chessova Desktop — UCI engine helper for in-browser chess review (headless)"
default-run = "chessova-desktop"

[[bin]]
name = "chessova-desktop"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
axum               = { version = "0.7", features = ["ws"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http         = { version = "0.5", features = ["cors"] }
anyhow             = "1"
futures-util       = "0.3"
