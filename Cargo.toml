[package]
name = "chessova-desktop"
version = "0.3.0"
edition = "2021"
description = "Chessova Desktop — UCI engine helper for in-browser chess review"
default-run = "chessova-desktop"

[[bin]]
name = "chessova-desktop"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
axum               = { version = "0.7", features = ["ws"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http         = { version = "0.5", features = ["cors"] }
anyhow             = "1"
futures-util       = "0.3"

# Tray icon (menu bar on macOS, system tray on Windows). Drives the
# `tray.rs` module — uses tao for the event loop because both Cocoa
# and Win32 require their event loops on the main thread.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.20"
tao       = "0.31"
