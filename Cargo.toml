[package]
name = "chessova-desktop"
version = "0.4.0"
edition = "2021"
description = "Chessova Desktop — UCI engine helper for in-browser chess review"
default-run = "chessova-desktop"

[[bin]]
name = "chessova-desktop"
path = "src/main.rs"

[dependencies]
tokio              = { version = "1", features = ["full"] }
axum               = { version = "0.7", features = ["ws"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http         = { version = "0.5", features = ["cors"] }
anyhow             = "1"
futures-util       = "0.3"

# Download + extract for the one-click engine installer. Rustls feature
# avoids OpenSSL — important for cross-compile from macOS to Windows.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tar     = "0.4"
flate2  = "1"
zip     = { version = "2", default-features = false, features = ["deflate"] }
dirs    = "5"
bytes   = "1"

# Tray icon (menu bar on macOS, system tray on Windows) + progress
# window (eframe). Both use platform-native windowing — Linux is
# omitted because the helper isn't shipped there yet.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.20"
tao       = "0.31"
eframe    = { version = "0.27", default-features = false, features = ["default_fonts", "glow"] }
